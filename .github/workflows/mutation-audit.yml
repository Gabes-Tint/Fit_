name: Scheduled mutation audit

# Three of the four mutation lanes, off the pull-request matrix since 2026-09-04
# (product owner's call, to cut runner minutes): changed-node, changed-client
# and the full tree. Only the security lane still gates a merge.
#
# None of these gates anything any more -- "we will pay debt daily" -- so a lane
# that finds debt must not fail this run either. Each one is `continue-on-error`
# and the reporting step reads what they wrote: a lane that swallowed its exit
# code and printed nothing would be worth less than not running it. The debt
# leaves here as a GitHub issue naming the surviving mutants, plus warning
# annotations and a job summary on the run itself.
#
# Thresholds are untouched. Not blocking is not the same as not measuring: a
# lowered number would make this report understate the debt it exists to find.
#
# A fifth job, `scheduled-self-test-mutation`, joined on 2026-09-05: it is not
# a mutation lane over the app and it is not debt reporting, it is the gate
# self-test's `mutation` group -- proof that Stryker itself still kills a
# planted mutant. It left the pull-request matrix in `ci.yml` because only a
# handful of paths can break it (see `scripts/quality/self-test-scope.ts`),
# but it still needs to run somewhere every day so a regression in the
# self-test cannot hide between the PRs that happen to touch those paths.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      refresh_ledger_only:
        description: >-
          Skip the mutation lanes and just refresh the ledger issue from the
          most recent successful run's artifacts (for an on-demand nudge, not
          a fresh measurement).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mutation-audit-${{ github.event_name == 'schedule' && 'scheduled-cold' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  scheduled-mutation:
    name: Scheduled mutation audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # A manual dispatch may ask to skip straight to refreshing the ledger
      # issue from the last successful run's evidence instead of paying for a
      # fresh measurement. A scheduled run never sets this input, so the
      # comparison below is false there and every lane still runs.
      - name: Download the latest audit artifacts
        if: github.event.inputs.refresh_ledger_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow mutation-audit.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful mutation-audit.yml run found to refresh the ledger from."
            exit 1
          fi
          artifact_name="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" --jq '.artifacts[0].name')"
          if [[ -z "$artifact_name" ]]; then
            echo "::error::Run $run_id has no mutation-evidence artifact to download."
            exit 1
          fi
          gh run download "$run_id" -n "$artifact_name" -D reports/mutation

      - name: Restore Playwright browser cache
        if: github.event.inputs.refresh_ledger_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: github.event.inputs.refresh_ledger_only != 'true'
        run: bunx playwright install --with-deps chromium

      # "Changed" is defined against a diff, and a scheduled run on `main` has no
      # base ref to diff against. Left alone, `resolveMutationBase` falls through
      # to `origin/main`, whose merge-base with HEAD is HEAD -- an empty scope, a
      # lane that mutates nothing, and a green check that proves nothing. So the
      # base is the tip of `main` as it stood a day ago: the changed lanes then
      # judge exactly what merged since the last audit, a day late but with the
      # strict killed-only verdict intact.
      #
      # A quiet day resolves to HEAD itself. That is a real answer, not a
      # failure, so the changed lanes are skipped and say so rather than
      # reporting a green run over an empty scope. The full lane covers the whole
      # tree either way. A base that will not resolve at all is a broken audit
      # and fails here.
      - name: Resolve the changed-lane base
        id: base
        if: github.event.inputs.refresh_ledger_only != 'true'
        run: |
          set -euo pipefail
          window='24 hours ago'
          head="$(git rev-parse HEAD)"
          base="$(git rev-list -1 --before="$window" "$head" || true)"
          if [[ -z "$base" ]]; then
            echo "::error::No commit on this branch predates '$window'; the changed lanes have no base to diff against."
            exit 1
          fi
          if [[ "$base" == "$head" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing merged in the last 24 hours (HEAD $head). Changed lanes skipped; the full lane still runs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "Changed lanes diff $base..$head (the last 24 hours of \`main\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the changed Node lane over the last day
        if: steps.base.outputs.changed == 'true' && github.event.inputs.refresh_ledger_only != 'true'
        continue-on-error: true
        env:
          MUTATION_BASE: ${{ steps.base.outputs.base }}
        run: bun run test:mutation:changed:node

      - name: Run the changed client lane over the last day
        if: steps.base.outputs.changed == 'true' && github.event.inputs.refresh_ledger_only != 'true'
        continue-on-error: true
        env:
          MUTATION_BASE: ${{ steps.base.outputs.base }}
        run: bun run test:mutation:changed:client

      # Always cold. No cache is restored for it, so the daily answer is a fresh
      # measurement of the whole tree rather than an increment on top of one.
      - name: Run the forced-cold full audit
        if: "!cancelled() && github.event.inputs.refresh_ledger_only != 'true'"
        continue-on-error: true
        run: bun run test:mutation:full -- --force-cold

      # The lanes above cannot fail the run, so this is what makes their findings
      # exist: it reads every verdict and crash record, names the mutants that
      # were not killed, writes the job summary and warning annotations, and sets
      # `debt` for the issue step. It always exits 0 -- it reports, it does not gate.
      - name: Collect the mutation debt report
        id: debt
        if: '!cancelled()'
        run: bun run report:mutation-debt

      - name: Upload full mutation evidence
        if: always() && github.event.inputs.refresh_ledger_only != 'true'
        uses: ./.github/actions/upload-report
        with:
          name: scheduled-mutation
          path: reports/mutation/
          if-no-files-found: error

      # Issue #87, option 1: every survivor is debt, and the daily audit routine
      # needs one living place to read it rather than a growing pile of issues.
      # This edits a single issue's body to the fresh report each day -- never
      # comments -- and only closes it once the report shows zero survivors of
      # any kind. It opens the issue the first time there is something to say;
      # a ledger with nothing owed does not need to exist yet.
      - name: Update the mutation debt ledger issue
        if: '!cancelled()'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const marker = '<!-- mutation-debt-ledger -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = readFileSync('reports/mutation/debt.md', 'utf8');
            const survivors = Number('${{ steps.debt.outputs.survivors }}' || '0');
            const body = `${marker}\n${report}\n\nMeasured on \`${context.sha}\`; full Stryker reports are attached to ${run}. These lanes report, they do not gate, so nothing is blocked and nothing else will tell you. Kill the surviving mutants or record a reviewed exception in \`quality/mutation-equivalents.json\` (an agent proposes, Gabriel approves). Do not lower a threshold: that would make this report understate the debt.`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'all', labels: 'mutation-debt' });
            const previous = issues.find((issue) => issue.body?.includes(marker));
            const desiredState = survivors === 0 ? 'closed' : 'open';

            if (previous) {
              const changes = { body };
              if (previous.state !== desiredState) changes.state = desiredState;
              await github.rest.issues.update({ owner, repo, issue_number: previous.number, ...changes });
            } else if (survivors > 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Mutation debt ledger',
                body,
                labels: ['quality', 'mutation-debt']
              });
            }

      # The ledger above only speaks to survivors. A lane that crashed measured
      # nothing at all, which is a different and rarer failure -- so it keeps
      # the old per-run behaviour: one issue per marker, commented on rather
      # than reopened, so a crash that repeats for a week does not file seven
      # issues.
      - name: Raise an issue when a lane crashes without a verdict
        if: steps.debt.outputs.crashed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const marker = '<!-- scheduled-mutation-audit-crash -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const report = readFileSync('reports/mutation/debt.md', 'utf8');
            const body = `${marker}\n${report}\n\nMeasured on \`${context.sha}\`; full Stryker reports are attached to ${run}. A lane crashed before reaching a verdict, which says nothing about the tree either way -- it is not the same as a surviving mutant, and the run needs a look.`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'quality' });
            const previous = issues.find((issue) => issue.body?.includes(marker));

            if (previous) {
              await github.rest.issues.createComment({ owner, repo, issue_number: previous.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Mutation lane crashed during the daily audit', body, labels: ['quality'] });
            }

  # The gate self-test's `mutation` group moved off the pull-request path on
  # 2026-09-05 (product owner): it proves Stryker itself still kills a planted
  # mutant in a fixture project, not the app, so `scripts/quality/gate.ts ci
  # --job self-test` with `SELF_TEST_GROUP=mutation` only reruns there when
  # `scripts/quality/self-test-scope.ts` finds a changed path that could break
  # it (the gate scripts, `quality/`, the Stryker configs, the workflows, or
  # the toolchain pins). It still has to run every day regardless of what
  # changed, or a regression in Stryker's own kill behavior could sit
  # undetected between the PRs that happen to touch those paths. Unlike the
  # lanes above, this one is a real gate, not a debt report -- a failure here
  # means the self-test fixtures no longer prove what they claim to -- so the
  # step is not swallowed with `continue-on-error` silently; it still opens an
  # issue the same way, using its own marker, rather than failing the workflow
  # loudly with no other trace.
  scheduled-self-test-mutation:
    name: Scheduled gate self-test (mutation)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      SELF_TEST_GROUP: mutation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Run the mutation self-test group
        id: self-test
        continue-on-error: true
        run: bun scripts/quality/gate.ts ci --job self-test

      - name: Upload self-test reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: scheduled-self-test-mutation

      # Same marker-comment pattern as the debt issue above, so a lane that
      # stays red for a week does not file seven issues.
      - name: Raise an issue when the mutation self-test group fails
        if: steps.self-test.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- scheduled-self-test-mutation -->';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe gate self-test's \`mutation\` group failed on the daily schedule: ${run}. That group moved off the pull-request path on 2026-09-05 and now only runs there when \`scripts/quality/self-test-scope.ts\` finds a path that can break it; this daily run is what still catches a regression on a day nothing touched those paths. See \`reports/quality/self-test.json\` in the run's artifact for which fixture failed. Unlike the debt lanes above, this one is a real gate: the self-test fixtures no longer prove what they claim to until it is fixed.`;
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'quality' });
            const previous = issues.find((issue) => issue.body?.includes(marker));

            if (previous) {
              await github.rest.issues.createComment({ owner, repo, issue_number: previous.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Gate self-test (mutation) failing on the daily schedule', body, labels: ['quality'] });
            }
