name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate below runs to completion and writes reports/quality/gate-*.json.
  # An agent reads that file instead of scraping thirteen text formats.
  static:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore scanner image and rule cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Semgrep's hash-verified rule pack lives here, not in ~/.cache, and the
          # pinned scanner images are saved here too: a `docker pull` per run
          # costs more than restoring them. Scoped to exactly those two, because
          # they are all these jobs populate -- Trivy's database is a gigabyte
          # and belongs to the nightly scan, which deliberately does not cache
          # it either. See nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        run: bun run security:images actionlint

      - name: Run static gate
        run: bun scripts/quality/gate.ts ci --job static

      - name: Upload static reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: static

  unit:
    name: Unit and component coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install browser runtimes
        run: bunx playwright install --with-deps chromium

      - name: Run coverage gate
        run: bun scripts/quality/gate.ts ci --job unit

      - name: Upload unit reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: unit
          path: |
            coverage/
            reports/

  # One lane, deliberately. The changed and full-tree lanes moved to the daily
  # schedule in mutation-audit.yml to cut runner minutes (product owner,
  # 2026-09-04). The security lane stays because the authentication boundary is
  # the one place where a test that fails to assert is a security risk rather
  # than a maintenance cost, and cold it is also the cheapest of the four at
  # 3m50.
  #
  # Kept as a matrix of one so the check keeps its name and `check:ci-contract`
  # keeps reading `job:` out of it; adding a lane back is one block, not a rewrite.
  #
  # `browser: false` on that leg, and the three steps below gated on
  # `matrix.browser`, are the block in question (#167). The security lane
  # mutates `src/lib/server/**` and never opens a browser; a client lane does,
  # and it needs Chromium -- but only when its changed scope is non-empty, which
  # is what `Plan browser mutation scope` works out before paying for the
  # download. Restoring `changed-client` is therefore adding a matrix leg with
  # `browser: true` and nothing else. The steps are dormant, not dead: deleting
  # them saves nineteen lines now and costs re-deriving a conditional browser
  # install the day the lane returns, so they stay until the lane comes back or
  # is retired on purpose.
  mutation:
    name: Mutation (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: security
            job: mutation-security
            lane: security
            browser: false
            timeout: 20
    env:
      MUTATION_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # Dormant while every matrix leg says `browser: false`; see the note above
      # the job for why the block stays.
      - name: Plan browser mutation scope
        if: matrix.browser
        id: mutation-scope
        run: |
          bun scripts/quality/mutation-run.ts ${{ matrix.lane }} --scope-only
          echo "needed=$(jq -r '.files | length > 0' reports/mutation/${{ matrix.lane }}/scope.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium cache
        if: matrix.browser && steps.mutation-scope.outputs.needed == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        if: matrix.browser && steps.mutation-scope.outputs.needed == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Restore validated mutation cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            reports/mutation/${{ matrix.lane }}/incremental.json
            reports/mutation/${{ matrix.lane }}/cache.json
          key: stryker-v2-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-${{ github.sha }}
          restore-keys: stryker-v2-${{ matrix.lane }}-${{ runner.os }}-${{ hashFiles('.tool-versions', 'bun.lock', 'stryker.config.mjs', 'vite.config.ts', 'quality/mutation-policy.json') }}-

      - name: Run required mutation lane
        run: bun scripts/quality/gate.ts ci --job ${{ matrix.job }}

      - name: Upload mutation evidence
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: mutation-${{ matrix.lane }}
          path: |
            reports/mutation/${{ matrix.lane }}/
            reports/quality/
          if-no-files-found: error

  build:
    name: Build and bundle budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Run build gate
        run: bun scripts/quality/gate.ts ci --job build

      - name: Upload build reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: build

  # One job per browser project. Sharding was worth doing twice over: the suite
  # runs four projects, and each job now installs the one engine it needs
  # instead of all three. Inside a job the workers are parallel too -- see
  # `tests/preview-server.ts` for the isolation that made that safe.
  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
          - project: chromium
            browser: chromium
          - project: firefox
            browser: firefox
    env:
      E2E_PROJECT: ${{ matrix.project }}
      # Shards report a blob each; `e2e-report` merges them into the single
      # HTML and JSON report an agent reads.
      E2E_BLOB_REPORT: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('bun.lock') }}

      - name: Install browser runtimes
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run end-to-end gate
        run: bun scripts/quality/gate.ts ci --job e2e

      - name: Upload e2e blob report
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: e2e-blob-${{ matrix.project }}
          path: blob-report/

      - name: Upload e2e reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: e2e-${{ matrix.project }}
          path: |
            reports/
            test-results/

  # The shards' blobs, merged back into the one HTML report a human opens and
  # the one `reports/quality/playwright.json` an agent reads.
  e2e-report:
    name: End-to-end report
    if: always()
    needs: [e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Collect shard blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: all-blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: bunx playwright merge-reports --config playwright.config.ts all-blob-reports

      - name: Upload merged report
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: e2e-merged
          path: |
            playwright-report/
            reports/quality/playwright.json
          if-no-files-found: error

  security:
    name: Security (blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore scanner image and rule cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Semgrep's hash-verified rule pack lives here, not in ~/.cache, and the
          # pinned scanner images are saved here too: a `docker pull` per run
          # costs more than restoring them. Scoped to exactly those two, because
          # they are all these jobs populate -- Trivy's database is a gigabyte
          # and belongs to the nightly scan, which deliberately does not cache
          # it either. See nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        run: bun run security:images gitleaks semgrep

      # Gitleaks and Semgrep are code-derived and deterministic, so they block a
      # merge. Trivy and ZAP depend on feeds that change without a code change;
      # gating on them would contradict the determinism this repo promises. They
      # run in nightly.yml instead.
      - name: Run blocking security gate
        run: bun scripts/quality/gate.ts ci --job security

      - name: Upload security reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: security

  # Decides whether the self-test's `mutation` group (below) can find anything
  # on this run. That group proves Stryker itself still kills a planted
  # mutant in a fixture project -- it never mutates the app -- so only the
  # gate scripts, the mutation policy, the workflows that wire it up, and the
  # toolchain pins it runs under can break it. Skipping it otherwise is what
  # took it off the pull-request critical path (~300s) in favor of
  # mobile-safari e2e (~200-235s); it still runs daily regardless of what
  # changed, in mutation-audit.yml (product owner, 2026-09-05). See
  # `scripts/quality/self-test-scope.ts` for the exact globs.
  self-test-scope:
    name: Gate self-test scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mutation-needed: ${{ steps.scope.outputs.needed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # No dependency install: this job runs one script that imports nothing
      # from `node_modules`, so an install here would be a minute spent on
      # nothing.
      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          install: 'false'

      - name: Decide whether the mutation self-test group can break
        id: scope
        env:
          SELF_TEST_SCOPE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: bun scripts/quality/self-test-scope.ts

  # Two runners here, split by what a fixture costs and what it needs
  # installed: the nested browser runs and everything else.
  # `scripts/quality/self-test-groups.ts` owns that split and
  # `check:ci-contract` proves this matrix, plus the standalone
  # `self-test-mutation` job below, still covers every group, so a fixture
  # added later cannot fall out of CI.
  #
  # The `mutation` group is not in this matrix: a job-level `if:` cannot
  # reference `matrix.*` (GitHub Actions restricts that context to `github`,
  # `needs`, `vars` and `inputs`), which is what a per-leg conditional skip
  # would need. `self-test-mutation`, below, is its own job for exactly that
  # reason.
  self-test:
    name: Gate self-test (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: browser
            docker: false
            browser: true
          - group: static
            docker: true
            browser: false
    env:
      SELF_TEST_GROUP: ${{ matrix.group }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      - name: Restore scanner image and rule cache
        if: matrix.docker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Scoped to what this job populates: the pinned scanner images and
          # Semgrep's rule pack. Trivy's database is not here -- see nightly.yml.
          path: |
            .security-cache/images
            .security-cache/semgrep
          key: security-cache-${{ runner.os }}-${{ hashFiles('scripts/security/config.ts') }}
          restore-keys: security-cache-${{ runner.os }}-

      - name: Warm pinned scanner images
        if: matrix.docker
        run: bun run security:images actionlint gitleaks semgrep

      - name: Restore Playwright browser cache
        if: matrix.browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('bun.lock') }}

      # The browser fixtures run the default project, which is mobile-chrome on
      # the Chromium engine. Firefox and WebKit are only needed by the e2e job.
      - name: Install browser runtimes
        if: matrix.browser
        run: bunx playwright install --with-deps chromium

      # Proves each gate rejects input it claims to reject. Without this, every
      # threshold in the repository is an assertion nobody has tested.
      - name: Run gate self-test
        run: bun scripts/quality/gate.ts ci --job self-test

      - name: Upload self-test reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: self-test-reports-${{ matrix.group }}

  # The `mutation` self-test group, split out of the matrix above because it
  # runs conditionally: `if:` here reads `needs.self-test-scope`, which a
  # job-level condition can do (unlike `matrix.*`). It reports a skipped
  # (neutral) check when `self-test-scope` found nothing that could break it,
  # and a real run otherwise -- the same fixtures, same gate command, just its
  # own job so the condition is legal. Runs daily regardless of the condition,
  # as `scheduled-self-test-mutation` in mutation-audit.yml.
  self-test-mutation:
    name: Gate self-test (mutation)
    needs: [self-test-scope]
    if: needs.self-test-scope.outputs.mutation-needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SELF_TEST_GROUP: mutation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the toolchain
        uses: ./.github/actions/setup

      # Proves the mutation gate itself still kills a planted mutant. Without
      # this, the mutation lanes' thresholds are assertions nobody has tested.
      - name: Run gate self-test
        run: bun scripts/quality/gate.ts ci --job self-test

      - name: Upload self-test reports
        if: always()
        uses: ./.github/actions/upload-report
        with:
          name: self-test-reports-mutation

  all-green:
    name: Quality and security
    if: always()
    needs:
      [
        static,
        unit,
        mutation,
        build,
        e2e,
        e2e-report,
        security,
        self-test,
        self-test-scope,
        self-test-mutation
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # self-test-mutation is the one job allowed to be `skipped`: it is
      # skipped only when self-test-scope found nothing that could break the
      # mutation self-test group (mutation-needed == 'false'). A skip for any
      # other reason -- self-test-scope itself failing, say -- must still fail
      # the merge gate, so this is checked explicitly against the scope
      # output rather than by loosening the general loop below for everyone.
      - name: Require self-test-mutation to have succeeded, or been correctly skipped
        env:
          RESULT: ${{ needs.self-test-mutation.result }}
          MUTATION_NEEDED: ${{ needs.self-test-scope.outputs.mutation-needed }}
        run: |
          echo "self-test-mutation: $RESULT (self-test-scope mutation-needed=$MUTATION_NEEDED)"
          if [[ "$RESULT" == "success" ]]; then
            exit 0
          fi
          if [[ "$RESULT" == "skipped" && "$MUTATION_NEEDED" == "false" ]]; then
            echo "Skipped correctly: self-test-scope found nothing that could break the mutation self-test group."
            exit 0
          fi
          echo "::error::self-test-mutation is $RESULT but self-test-scope reports mutation-needed=$MUTATION_NEEDED; it must succeed, or be skipped only when not needed."
          exit 1

      - name: Require every other gate to pass
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          MUTATION: ${{ needs.mutation.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_REPORT: ${{ needs.e2e-report.result }}
          SECURITY: ${{ needs.security.result }}
          SELF_TEST: ${{ needs.self-test.result }}
          SELF_TEST_SCOPE: ${{ needs.self-test-scope.result }}
        run: |
          echo "Gate results: static=$STATIC unit=$UNIT mutation=$MUTATION build=$BUILD e2e=$E2E e2e-report=$E2E_REPORT security=$SECURITY self-test=$SELF_TEST self-test-scope=$SELF_TEST_SCOPE"
          for result in "$STATIC" "$UNIT" "$MUTATION" "$BUILD" "$E2E" "$E2E_REPORT" "$SECURITY" "$SELF_TEST" "$SELF_TEST_SCOPE"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required gate did not succeed."
              exit 1
            fi
          done
