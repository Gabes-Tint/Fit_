[project]
name = "fitflow"
version = "0.1.0"
description = "Driver for block 1 (pick and plan) of Fit_'s development flow."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C90"]
mccabe.max-complexity = 6

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fitflow"]
