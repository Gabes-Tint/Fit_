# Advanced capability at low effort: the planner's turns are short, but the
# delegation contract (nine evidenced signals under a precedence table) is
# judgment a basic model could not hold on three real runs.
# Interprets the story and defines its plan, slices and capability signals.
planner:
  backend: claude
  model: opus
  effort: low

# Basic capability at medium effort for focused, well-scoped work with
# nothing relevant left to decide. Writes acceptance tests in block 1;
# implements a fully determined slice in block 3, escalating to builder
# when its attempts run out.
mechanic:
  backend: claude
  model: haiku
  effort: medium

# Advanced capability at low effort for ordinary implementation with a clear
# objective, known area and pattern, but real construction decisions left
# to make. Escalates to solver when its attempts run out.
builder:
  backend: claude
  model: opus
  effort: low

# Advanced capability selected when the solution or cause is uncertain, or
# the slice touches auth, shared state, the store or another sensitive area.
# Example: opus with high reasoning effort.
# The final rung: when its attempts run out, the run stops and preserves.
solver:
  backend: claude
  model: opus
  effort: high

# Advanced capability, read-only, at delivery (block 4). Reviews the PR's
# actual diff against the repository's review guidelines and returns a
# verdict; it never writes to the worktree, and the driver verifies that.
# Medium effort: the review is bounded to the diff and the guidelines.
reviewer:
  backend: claude
  model: opus
  effort: medium
